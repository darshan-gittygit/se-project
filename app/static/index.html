<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Requora AI - Requirements Engineering &amp; SDLC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" width="28" height="28" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="13.5" fill="none" stroke="#B26CFF" stroke-width="2.4"/>
      <path d="M16 7 L23 16 L16 25 L9 16 Z" fill="#C79CFF"/>
      <circle cx="16" cy="16" r="3.2" fill="#000"/>
    </svg>
    <span class="brand-name">REQUORA <span class="brand-ai">AI</span></span>
    <span class="brand-credit">by Darshan</span>
  </div>
  <div class="topbar-actions">
    <label for="roleSelect" class="role-label">Role</label>
    <select id="roleSelect" aria-describedby="roleHint">
      <option value="business analyst">Business analyst</option>
      <option value="product owner">Product owner</option>
      <option value="security officer">Security officer</option>
      <option value="compliance officer">Compliance officer</option>
      <option value="project manager">Project manager</option>
      <option value="architect">Architect</option>
      <option value="auditor">Auditor (read-only)</option>
    </select>
    <span id="roleHint" class="visually-hidden">Sent as the X-Role header on every request.</span>
    <button type="button" class="btn btn-ghost" id="newAnalysisBtn">New analysis</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" aria-label="Pipeline stages">
    <h2 class="sidebar-title">Pipeline</h2>
    <ol class="stage-list" id="stageList"></ol>
    <div class="run-info" id="runInfo"></div>
  </aside>

  <main class="main" id="main">
    <div id="banners" class="banners" aria-live="polite"></div>
    <nav class="tabs" role="tablist" aria-label="Sections" id="tabs"></nav>
    <section class="panel-area" id="panel" role="tabpanel" tabindex="-1"></section>
  </main>
</div>

<footer class="page-footer">Requora AI &mdash; built by <strong>Darshan</strong> &middot; NIT Karnataka, Surathkal</footer>

<dialog id="dialog" class="dialog" aria-labelledby="dialogTitle"></dialog>

<script src="/static/charts.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
